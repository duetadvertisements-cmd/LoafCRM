<html>
    <head>
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <script src="indexScript.js" defer></script>
        <link rel="stylesheet" href="indexStyle.css">
    </head>
 
    <body>

        <div class="container">
            <!-- BRAND -->
             <div class="brand">
                <img src="../resources/logo.png" alt="Loaf CRM Logo">
            </div>
            <!-- SIGN UP -->
            <div id="signUpPage" class="card active">
                <h1>Sign Up</h1>

                <input type="text" id="signInPageUsernameInput" placeholder="Username"><br><br>
                <input type="text" id="signInPageEmailInput" placeholder="Email"><br><br>
                <input type="password" id="signInPagePasswordInput" placeholder="Password"><br><br>

                <button onclick="signUp()">Sign Up</button>

                <p class="switchText">
                    Already have an account?
                    <span onclick="showLogin()">Login</span>
                </p>
            </div>

            <!-- LOGIN -->
            <div id="loginPage" class="card">
                <h1>Login</h1>

                <input type="text" id="loginPageUsernameInput" placeholder="Username"><br><br>
                <input type="password" id="loginPagePasswordInput" placeholder="Password"><br><br>

                <button onclick="login()">Login</button>

                <p class="switchText">
                    Don't have an account?
                    <span onclick="showSignUp()">Sign Up</span>
                </p>
            </div>
        </div>
        <div id = "testDiv">
            <button onclick = "clockIn ()">Clock in</button>
            <button onclick = "clockOut ()">Clock Out</button>
        </div>
    </body>
</html>
