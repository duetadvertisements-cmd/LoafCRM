<HTML>
    <HEAD>
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <script src = "dashboardScript.js" defer></script>
        <link rel = "Stylesheet" href = "dashboardStyle.css">
    </HEAD>
    <BODY>
        <!-- Mobile Menu Toggle -->
        <button class="mobile-menu-toggle" onclick="toggleMobileMenu()">☰</button>
        <div class="sidebar-overlay" onclick=""></div>

        <div class="sidebar" id="sidebar">
            <div class="sidebar-header">
                <h2>Loaf CRM</h2>
            </div>
            <nav class="sidebar-nav">
                <a href="#" onclick="event.preventDefault(); showSection('tickets');" class = "nav-item">
                    <span class="nav-icon">📋</span>
                    Tickets
                </a>
                <a href="#" onclick="event.preventDefault(); showSection('settings');" class = "nav-item">
                    <span class="nav-icon">⚙️</span>
                    Settings
                </a>
                <a href="#" class="nav-item" onclick="event.preventDefault(); showSection('addUser')">
                    <span class="nav-icon">👤</span>
                    Add User
                </a>
                <a href="#" onclick="event.preventDefault(); logout ();" class = "nav-item">
                    <span class="nav-icon">🚪</span>
                    Logout
                </a>
                
            </nav>
        </div>

        <div class="main-content">
            <div id="tickets-section" class="content-section active">
                <div class="header">
                    <h1 id = "welcomeTitle"></h1>
                    <button onclick = "addTicket ()">Add Ticket</button> <br><br>
                    <input type = "text" id = "titleInput" placeholder="Ticket Title"> <br>
                    <input type = "text" id = "dataInput" placeholder="Ticket Description">   <br>
                </div>
                
                <div id = "filterSelection">
                    <div class="settings-card">
                            <div class="settings-group">
                                <select id="theme-selector" onchange="changeFilter(this.value)">
                                    <option value="ALL">All</option>
                                    <option value="OPEN">Status: Open</option>
                                    <option value="CLOSED">Status: Closed</option>   
                            </select>
                        </div>  
                    </div>
                </div>

                <div id="ticketContainer" class="ticket-container"></div>
            </div>

            <div id="settings-section" class="content-section">
                <div class="header">
                    <h1>Settings</h1>
                    <p>Configure your account and application settings.</p>
                </div>
                    <div class="settings-card">
                        <h3>🎨 Appearance</h3>
                        <div class="settings-group">
                            <label>Choose Theme</label>
                            <select id="theme-selector" onchange="applyTheme(this.value)">
                                <option value="cobalt_horizon">Cobalt Horizon</option>
                                <option value="royalLuxe">Royal Luxe</option>
                                <option value="phantom_forest">Phantom Forest</option>
                                <option value="desert_slate">Desert Slate</option>
                                <option value="basic">Basic Light</option>
                        </select>
                    </div>  
                </div>
            </div>
            <div id="addUser-section" class="content-section">
                <div class="header-banner">
                    <input type = "text" id = "usernameInput" placeholder="Username"> <br><br>
                    <button type = "button"onclick = "generateAndSendOTP (event)" id = "addUserButton">Add User</button> <br><br>
                </div>
            </div>
        </div>
        <div class="otp-modal-overlay hidden" id = "OTPModal">
            <div class="otp-modal">
                <button class="modal-close" onclick="closeOTPModal(); sessionStorage.setItem ('showOTPModal', 'false');">×</button>
                <h2>Verify OTP</h2>
                <p>Enter the 6-digit code sent to the users email</p>

                <div class="otp-inputs">
                <input type="text" maxlength="1" />
                <input type="text" maxlength="1" />
                <input type="text" maxlength="1" />
                <input type="text" maxlength="1" />
                <input type="text" maxlength="1" />
                <input type="text" maxlength="1" />
                </div>

                <button type = "button" class="verify-btn" onclick = "verifyOTP ()">Verify</button>

                <p class="resend">
                Didn't receive it? <span>Resend</span>
                </p>

            </div>
        </div>
    </BODY>
</HTML>
